[package]
name = "rustgis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "rustgis"
description = "RustGIS desktop app"

[lints]
workspace = true

[dependencies]
rustgis-engine = { workspace = true, features = ["geolibre"] }
rustgis-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "links", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The Windows exe icon (build.rs). Gated on the host, so other platforms build neither.
[target.'cfg(windows)'.build-dependencies]
tiny-skia = { workspace = true }
embed-resource = "3"

# macOS: reads the native title bar's geometry (window buttons, height) so the header can sit in it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
